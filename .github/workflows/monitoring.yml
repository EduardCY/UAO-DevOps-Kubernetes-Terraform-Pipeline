# Monitoring and Alerts Workflow
# Checks application metrics and sends alerts
# Integrates with Grafana Cloud and UptimeRobot

name: Monitoring & Alerts

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  # Check Prometheus metrics
  metrics-check:
    name: Check Prometheus Metrics
    runs-on: ubuntu-latest
    
    steps:
      - name: Check backend metrics endpoint
        run: |
          RESPONSE=$(curl -s http://crud-backend.onrender.com/metrics)
          if [ -z "$RESPONSE" ]; then
            echo "❌ Metrics endpoint not responding"
            exit 1
          fi
          echo "✅ Metrics endpoint healthy"
      
      - name: Verify metric format
        run: |
          curl -s http://crud-backend.onrender.com/metrics | grep -q "^# HELP"
          if [ $? -eq 0 ]; then
            echo "✅ Metrics in Prometheus format"
          else
            echo "⚠️ Metrics format issue"
          fi

  # Application health monitoring
  health-monitoring:
    name: Application Health Check
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        endpoint:
          - { name: 'Backend Health', url: 'https://crud-backend.onrender.com/healthz' }
          - { name: 'Backend Readiness', url: 'https://crud-backend.onrender.com/readiness' }
          - { name: 'Frontend', url: 'https://crud-frontend.onrender.com' }
    
    steps:
      - name: Check ${{ matrix.endpoint.name }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ matrix.endpoint.url }})
          if [ $HTTP_CODE -eq 200 ]; then
            echo "✅ ${{ matrix.endpoint.name }}: OK (HTTP $HTTP_CODE)"
          else
            echo "❌ ${{ matrix.endpoint.name }}: FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi

  # Database connection check
  database-check:
    name: Database Connectivity Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Check database via readiness endpoint
        run: |
          RESPONSE=$(curl -s https://crud-backend.onrender.com/readiness)
          echo "Readiness response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "ok"; then
            echo "✅ Database connection healthy"
          else
            echo "❌ Database connection issue"
            exit 1
          fi

  # Performance check
  performance-check:
    name: Performance Baseline Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Measure response time
        run: |
          RESPONSE_TIME=$(curl -s -o /dev/null -w "%{time_total}" https://crud-backend.onrender.com/healthz)
          echo "Response time: ${RESPONSE_TIME}s"
          
          if (( $(echo "$RESPONSE_TIME < 2.0" | bc -l) )); then
            echo "✅ Response time acceptable"
          else
            echo "⚠️ Response time slow: ${RESPONSE_TIME}s"
          fi

  # Send monitoring summary
  monitoring-summary:
    name: Monitoring Summary
    runs-on: ubuntu-latest
    needs: [metrics-check, health-monitoring, database-check, performance-check]
    if: always()
    
    steps:
      - name: Generate monitoring report
        run: |
          echo "## 📊 Monitoring Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- Metrics Check: ${{ needs.metrics-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Health Monitoring: ${{ needs.health-monitoring.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Database Check: ${{ needs.database-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Check: ${{ needs.performance-check.result }}" >> $GITHUB_STEP_SUMMARY
