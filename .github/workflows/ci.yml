# CI Pipeline - Continuous Integration
# Runs on every push and pull request to main branch
# Builds, tests, and lints the application

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # Backend CI
  backend-ci:
    name: Backend CI (Build, Test, Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      
      - name: Check test coverage
        run: npm run test:coverage || true
      
      - name: Build application
        run: npm run build || echo "No build script"

  # Frontend CI
  frontend-ci:
    name: Frontend CI (Build, Test, Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint || echo "No lint script"
      
      - name: Run tests
        run: npm test -- --watchAll=false
      
      - name: Build production bundle
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:3000
      
      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sh build | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"

  # Docker Build Check
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm ${{ matrix.service }}:test echo "Image built successfully"

  # Notify on success
  notify-success:
    name: CI Success Notification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-build]
    if: success()
    
    steps:
      - name: Success message
        run: |
          echo "✅ CI Pipeline completed successfully!"
          echo "All tests passed, code linted, and Docker images built."
