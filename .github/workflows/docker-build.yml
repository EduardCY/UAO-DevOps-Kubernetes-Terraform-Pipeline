# Docker Build Optimization Workflow
# Uses BuildKit for faster, more efficient Docker builds
# Implements layer caching and multi-stage builds

name: Docker Build Optimization

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-build.yml'

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Optimized Backend Build
  build-backend:
    name: Build Backend with BuildKit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
      
      - name: Build backend with layer caching
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: backend:optimized
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Analyze image size
        run: |
          docker images backend:optimized --format "Size: {{.Size}}"
          docker history backend:optimized

  # Optimized Frontend Build
  build-frontend:
    name: Build Frontend with BuildKit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
      
      - name: Build frontend with layer caching
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: frontend:optimized
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Analyze image size
        run: |
          docker images frontend:optimized --format "Size: {{.Size}}"
          docker history frontend:optimized

  # Test Docker Compose
  test-compose:
    name: Test Docker Compose Stack
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build with Docker Compose
        run: |
          docker compose build --parallel
      
      - name: Start services
        run: |
          docker compose up -d
      
      - name: Wait for services
        run: sleep 15
      
      - name: Test backend health
        run: |
          curl -f http://localhost:3000/healthz || exit 1
      
      - name: Test frontend availability
        run: |
          curl -f http://localhost:3001 || exit 1
      
      - name: View logs
        if: failure()
        run: |
          docker compose logs
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

  # Build performance report
  build-report:
    name: Build Performance Report
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()
    
    steps:
      - name: Generate report
        run: |
          echo "## 🐳 Docker Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.build-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.build-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Optimizations Applied" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ BuildKit enabled" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Layer caching with GitHub Actions cache" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Multi-stage builds" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Alpine-based images" >> $GITHUB_STEP_SUMMARY
