# Prometheus Alert Rules
# Defines alerting conditions for the CRUD application

groups:
  # Application Health Alerts
  - name: application_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job="backend-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Backend service is down"
          description: "Backend API {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec on {{ $labels.instance }}."

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Slow API response time"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }}."

  # Resource Usage Alerts
  - name: resource_usage
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 200
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}MB on {{ $labels.instance }}."

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}."

  # Database Alerts
  - name: database_health
    interval: 30s
    rules:
      - alert: DatabaseConnectionFailed
        expr: up{job="postgres-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection failed"
          description: "Cannot connect to PostgreSQL database."

      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High number of database connections"
          description: "Database has {{ $value }} active connections."

  # Traffic Alerts
  - name: traffic_patterns
    interval: 30s
    rules:
      - alert: LowTraffic
        expr: rate(http_requests_total[5m]) < 0.01
        for: 10m
        labels:
          severity: info
          component: backend
        annotations:
          summary: "Unusually low traffic"
          description: "Request rate is {{ $value }} req/sec, which is unusually low."

      - alert: TrafficSpike
        expr: rate(http_requests_total[1m]) > rate(http_requests_total[5m]) * 2
        for: 2m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Traffic spike detected"
          description: "Request rate doubled to {{ $value }} req/sec on {{ $labels.instance }}."

  # Business Metrics Alerts
  - name: business_metrics
    interval: 1m
    rules:
      - alert: HighUserCreationFailureRate
        expr: rate(user_creation_failures_total[5m]) / rate(user_creation_attempts_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "High user creation failure rate"
          description: "{{ $value | humanizePercentage }} of user creations are failing."
